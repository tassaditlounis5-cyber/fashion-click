                             <!-- Formulaire d'inscription --> 
                              <form method="POST" action="#">
                                 <div class="form-container"> 
                                    <h2>Formulaire d'inscription</h2>
                                     <div class="form-group"> 
                                        <label for="pseudo">Nom :</label> 
                                        <input type="text" name="pseudo" id="pseudo" size="50" maxlength="80" required> 
                                    </div> 
                                    <div class="form-group">
                                         <label for="prenom">Prénom :</label> 
                                         <input type="text" name="prenom" id="prenom" size="50" maxlength="80" required>
                                         </div> 
                                         <div class="form-group"> 
                                            <label for="email">Adresse e-mail :</label>
                                             <input type="email" name="email" id="email" required> 
                                            </div> 
                                            <div class="form-group">
                                                 <label for="telephone">Numéro de téléphone :</label> 
                                                 <input type="tel" name="telephone" id="telephone" required> </div>
                                                  <div class="form-group"> 
                                                    <label for="age">Âge :</label>
                                                     <input type="number" name="age" id="age" required> </div> 
                                                     <div class="form-group"> <label>Genre :</label> 
                                                        <div class="gender-options"> 
                                                            <label for="homme">
                                                                 <input type="radio" name="genre" value="homme" id="homme" required> Homme </label> 
                                                                 <label for="femme">
                                                                     <input type="radio" name="genre" value="femme" id="femme"> Femme </label>
                                                                     </div> 
                                                                    </div>
                                                                     <div class="form-group">
                                                                         <label for="password">Mot de passe :</label>
                                                                          <input type="password" name="password" id="password" required>
                                                                         </div> <div class="form-group">
                                                                             <label for="confirm_password">Confirmer le mot de passe :</label> 
                                                                             <input type="password" name="confirm_password" id="confirm_password" required> 
                                                                            </div>
                                                                             <div class="form-group">
                                                                                 <label>Préférences :</label>
                                                                                  <div class="preferences"> 
                                                                                    <label><input type="checkbox" name="preferences" value="T-shirts"> T-shirts</label>
                                                                                     <label><input type="checkbox" name="preferences" value="Robes"> Robes</label> 
                                                                                     <label><input type="checkbox" name="preferences" value="Chemises"> Chemises</label>
                                                                                      <label><input type="checkbox" name="preferences" value="Pantalons"> Pantalons</label>
                                                                                       <label><input type="checkbox" name="preferences" value="Chaussures"> Chaussures</label>
                                                                                     </div> </div>
                                                                                      <div class="form-group"> 
                                                                                        <label for="terms"> 
                                                                                            <input type="checkbox" name="terms" id="terms" required> J'accepte les <a href="#">termes et conditions</a>
                                                                                         </label>
                                                                                         </div>
                                                                                          <button type="submit">S'inscrire</button>
                                                                                         </div>
