<body>
  <header>

        <!-- Logo -->

          <img src="FASHION.png" alt="Logo du magasin" width="150" height="100">

        <!-- Menu de navigation -->

          <!-- Icône du menu -->

        </div>
      </header>
      <div class="container">
        <h1>Bienvenue dans notre Boutique</h1>
        <div class="categories">
            <div class="category" onclick="showCategory('homme')">
                <h2>Homme</h2>
            </div>
            <div class="category" onclick="showCategory('femme')">
                <h2>Femme</h2>
            </div>
            <div class="category" onclick="showCategory('enfant')">
                <h2>Enfants</h2>
            </div>
        </div>
    
        <!-- Produits de la catégorie sélectionnée -->
        <div id="products" class="products">
            <!-- Les produits seront insérés ici via JavaScript -->
        </div>
    </div>
    
    <!-- Panier -->
    <div id="cart-popup" class="cart-popup">
        <h2>Mon Panier</h2>
        <ul id="cart-items"></ul>
        <p>Total: <span id="cart-total">€0.00</span></p>
        <button onclick="checkout()">Valider la commande</button>
        <button onclick="clearCart()">Vider le panier</button>
    </div>
